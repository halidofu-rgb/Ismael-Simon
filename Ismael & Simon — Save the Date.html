<style>
/* ============ FONTS ============
   Add your licensed files here. In a hosted folder use url("fonts/....woff2").
   For a single self-contained file, replace the url() with a base64 data: URI.
   Until then the fallbacks (Pinyon Script / Cormorant Garamond) are used. */
@font-face{font-family:"Sloop Script";src:local("Sloop Script"),local("SloopScript"),url("fonts/SloopScript.woff2") format("woff2");font-display:swap}
@font-face{font-family:"New Icon";src:local("New Icon"),local("NewIcon"),url("fonts/NewIcon-Light.woff2") format("woff2");font-weight:300;font-display:swap}
@font-face{font-family:"New Icon";src:local("New Icon Regular"),url("fonts/NewIcon-Regular.woff2") format("woff2");font-weight:400;font-display:swap}

/* ============ TOKENS ============ */
:root{
  --blue:#1a2fe0; --blue-deep:#0b16a0; --gold:#e9d7ab; --gold-line:rgba(233,215,171,.38);
  --script:"Sloop Script","Pinyon Script","Snell Roundhand",cursive;
  --serif:"New Icon","Cormorant Garamond","Cormorant","Times New Roman",serif;
  --pad:clamp(1.25rem,4.2vw,4.5rem);
  --ease:cubic-bezier(.19,.72,.12,1);
  --s-sm:clamp(.95rem,1.35vw,1.3rem); --s-md:clamp(1.15rem,1.8vw,1.7rem);
  --s-xl:clamp(2.6rem,6vw,6rem);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{background:var(--blue);scroll-behavior:smooth}
body{background:radial-gradient(120% 70% at 50% 0%,#2a40f5 0%,var(--blue) 48%,#1326c8 100%);color:var(--gold);
  font-family:var(--serif);font-weight:300;line-height:1.35;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.script{font-family:var(--script);font-weight:400;line-height:1}
svg.line{fill:none;stroke:var(--gold);stroke-width:.9;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
svg.line .fl{fill:var(--gold);stroke:none}
a{color:inherit}
:focus-visible{outline:1px solid var(--gold);outline-offset:4px}

/* ============ MOTION ============ */
.rv{opacity:0;transform:translateY(22px);transition:opacity 1.7s var(--ease) var(--d,0s),transform 1.7s var(--ease) var(--d,0s)}
.in .rv{opacity:1;transform:none}
.ln{display:block;overflow:hidden;padding-bottom:.08em}
.ln>span{display:block;transform:translateY(108%);transition:transform 1.6s var(--ease) var(--d,0s)}
.in .ln>span{transform:none}
.draw path:not(.fl){stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 3.4s cubic-bezier(.45,.05,.25,1)}
.in .draw path:not(.fl){stroke-dashoffset:0}
.draw ellipse,.draw circle,.draw .fl{opacity:0;transition:opacity 2s ease 1.8s}
.in .draw ellipse,.in .draw circle,.in .draw .fl{opacity:1}
.fl{transform-box:fill-box;transform-origin:50% 100%}
.in .fl{animation:flick 3.6s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.86) scaleX(1.06)}}
.sec::before{content:"";position:absolute;top:0;left:var(--pad);right:var(--pad);height:1px;background:var(--gold-line);
  transform:scaleX(0);transform-origin:left;transition:transform 2.4s var(--ease)}
.sec.in::before{transform:none}

/* ============ HERO (approved — unchanged) ============ */
.hero{position:relative;min-height:max(100svh,44rem);padding:var(--pad);display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:3}
.dear{font-size:clamp(2rem,4vw,3.6rem)}
.look{font-style:italic;font-size:var(--s-sm);text-align:right;line-height:1.4}
.chand-wrap{position:absolute;top:0;left:50%;transform:translate3d(-50%,var(--py,0px),0);z-index:1;pointer-events:none}
.chand{display:block;height:clamp(19rem,52svh,36rem);aspect-ratio:400/390;width:auto;
  transform:translateY(-70%);opacity:0;filter:drop-shadow(0 0 14px rgba(233,215,171,.22));
  transition:transform 3.6s var(--ease) .2s,opacity 2.4s ease .2s}
.in .chand{transform:none;opacity:1}
.title{margin-top:auto;position:relative;z-index:2}
.wd{font-size:clamp(2.2rem,6.4vw,6rem);transform:rotate(-4deg);margin:0 0 -.32em 7vw;position:relative;z-index:3;display:inline-block}
h1{font-weight:300;font-size:clamp(3.4rem,min(14.5vw,20svh),18rem);line-height:.86;letter-spacing:-.012em}
h1 .r{text-align:right;padding-right:2vw}
.amp{font-family:var(--script);font-style:normal;font-size:.78em;margin-left:.06em;display:inline-block;transform:translateY(.04em)}
.a2{display:none}
.bottom{display:grid;grid-template-columns:1fr minmax(0,1.55fr) 1fr;align-items:end;gap:var(--pad);margin-top:clamp(1.2rem,3svh,2.4rem);position:relative;z-index:2}
.date,.at{font-size:var(--s-md);line-height:1.22}
.date .script,.at .script{font-size:1.5em;display:block}
.at{text-align:right}
.at small{display:block;font-size:.72em;font-style:italic;margin-top:.5em}
.table{width:100%;height:auto;display:block}

/* ============ SECTIONS ============ */
.sec{position:relative;padding:clamp(6rem,17vh,12rem) var(--pad)}
.lab{font-style:italic;font-size:var(--s-sm);letter-spacing:.05em;margin-bottom:2.4rem}
h2{font-weight:300;font-size:var(--s-xl);line-height:1}
p.txt{font-size:var(--s-md);max-width:30ch;line-height:1.5;margin-top:2rem}
.lk{display:inline-block;margin:2.2rem 2.2rem 0 0;font-style:italic;font-size:var(--s-md);text-decoration:none;border-bottom:1px solid var(--gold);padding-bottom:.2em}
.lab2{font-style:italic;font-size:var(--s-sm);letter-spacing:.05em}

/* 01 */
.d-grid{display:grid;grid-template-columns:1fr auto;gap:var(--pad);align-items:end}
.d-wrap{position:relative;display:flex;align-items:flex-end;gap:1.5vw}
.num{font-size:clamp(9rem,34vw,32rem);line-height:.8;color:transparent;-webkit-text-stroke:1px var(--gold);letter-spacing:-.03em;padding-bottom:.06em}
.mo{position:absolute;left:34%;bottom:2%;font-size:clamp(4.5rem,15vw,14rem);transform:rotate(-8deg);text-shadow:0 0 30px var(--blue)}
.yr{writing-mode:vertical-rl;font-size:clamp(1.6rem,4.4vw,4rem);letter-spacing:.24em;margin-bottom:.8rem}
.d-txt{text-align:right;font-size:var(--s-md);line-height:1.45;padding-bottom:1rem}
.cd-live{display:block;font-style:normal;font-size:clamp(1.15rem,2.8vw,1.85rem);letter-spacing:.02em;line-height:1.4;margin-top:1.5rem;opacity:.96}

/* 02 */
.m-grid{display:grid;grid-template-columns:7fr 5fr;gap:calc(var(--pad)*1.5);align-items:center}
.m-txt{padding-top:14vh}
.facade{width:100%;height:auto;display:block}
.adr{font-style:normal;font-size:var(--s-md);line-height:1.5;margin-top:2.6rem}

/* 03 */
.ev{font-size:clamp(2.6rem,8.4vw,8.4rem);line-height:1.02;font-weight:300}
.ev .ln:nth-child(2){padding-left:14vw}
.ev .ln:nth-child(3){padding-left:32vw;font-style:italic}
.ev-p{margin:3rem 0 0 auto;text-align:right;max-width:26ch;font-size:var(--s-md)}

/* 04 timeline */
.tl-note{font-style:italic;font-size:var(--s-md);margin:1.6rem 0 clamp(3rem,8vh,6rem)}
.tl-row{position:relative;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:var(--pad);align-items:baseline;padding:clamp(1.6rem,4.5vh,3.2rem) 0}
.tl-row::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:var(--gold-line);transform:scaleX(0);transform-origin:left;transition:transform 2.2s var(--ease) var(--d,0s)}
.in .tl-row::before{transform:none}
.tl-row:last-child{border-bottom:1px solid var(--gold-line)}
.tl-row:nth-child(even){padding-left:9vw}
.tl-t{font-size:clamp(3.8rem,12.5vw,11.5rem);line-height:.85;letter-spacing:-.02em;color:transparent;-webkit-text-stroke:1px var(--gold)}
.hi .tl-t{color:var(--gold);-webkit-text-stroke:0}
.tl-row h3{font-weight:300;font-size:clamp(1.6rem,3.6vw,3.4rem);line-height:1.05}
.tl-row p{font-style:italic;font-size:var(--s-md);margin-top:.6rem}

/* 05 dress code */
.dc-grid{display:grid;grid-template-columns:6fr 5fr;gap:calc(var(--pad)*1.5);align-items:end}
.dc-h{font-size:clamp(4rem,13vw,13rem);line-height:.9;letter-spacing:-.02em}
.dc-l{margin-top:3rem}
.dc-l div{display:grid;grid-template-columns:minmax(7rem,1fr) 2.4fr;gap:1rem;padding:1.2rem 0;border-top:1px solid var(--gold-line);align-items:baseline}
.dc-l dt{font-style:italic;font-size:var(--s-sm)}
.dc-l dd{font-size:clamp(1.3rem,2.6vw,2.4rem);line-height:1.15}
.sw-row{display:flex;gap:clamp(.8rem,2.4vw,2rem);justify-content:flex-end;align-items:flex-start}
.sw{width:clamp(4.4rem,13vw,10rem)}

.arch{display:block;position:relative;aspect-ratio:1/2.1;border:1px solid var(--gold);border-radius:999px 999px 0 0;overflow:hidden}
.arch i{position:absolute;inset:0;background:var(--c);clip-path:inset(100% 0 0 0);transition:clip-path 2.4s var(--ease) var(--d,0s)}
.in .arch i{clip-path:inset(0)}
.sw figcaption{margin-top:.9rem;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;text-align:center}

/* 06 stay */
.onsite{display:grid;grid-template-columns:7fr 5fr;gap:var(--pad);align-items:end;margin-top:clamp(3rem,8vh,6rem);padding-top:2.4rem;border-top:1px solid var(--gold-line)}
.onsite h3{font-weight:300;font-size:clamp(2.2rem,5.4vw,5rem);line-height:1;margin-top:1rem}
.onsite p.d{font-size:var(--s-md);line-height:1.5}
.near-h{margin:clamp(3.5rem,9vh,6.5rem) 0 1.2rem}
.near{border-top:1px solid var(--gold-line)}
.nr{display:grid;grid-template-columns:5fr 6fr;gap:var(--pad);padding:1.9rem 0;border-bottom:1px solid var(--gold-line);align-items:start}
.nr h3{font-weight:300;font-size:clamp(1.5rem,3.2vw,3rem);line-height:1.1}
.nr .loc{font-style:italic;font-size:var(--s-sm);margin-top:.5rem}
.nr p.d{font-size:var(--s-sm);line-height:1.5;max-width:44ch}
.nr .lk{margin-top:1.1rem;font-size:var(--s-sm)}

/* 07 info */
.info{margin-top:1rem;border-top:1px solid var(--gold-line)}
.row{display:grid;grid-template-columns:minmax(6rem,1fr) 3fr;gap:var(--pad);padding:1.7rem 0;border-bottom:1px solid var(--gold-line);align-items:baseline}
.row dt{font-style:italic;font-size:var(--s-sm)}
.row dd{font-size:clamp(1.4rem,3vw,2.8rem);line-height:1.15}

/* 08 rsvp */
.rsvp{background:var(--gold);color:var(--blue-deep);--gold-line:rgba(11,22,160,.3)}
.rsvp .sc{font-size:clamp(2rem,4.4vw,4rem);margin-bottom:.4rem}
.rsvp .lk{border-color:var(--blue-deep)}
.r-grid{display:grid;grid-template-columns:5fr 6fr;gap:calc(var(--pad)*1.5)}
form{display:grid;gap:2rem;padding-top:.6rem}
label,.fs{font-style:italic;font-size:var(--s-sm);display:block}
input[type=text],input[type=number],textarea{width:100%;background:transparent;border:0;border-bottom:1px solid var(--blue-deep);
  font:inherit;font-size:var(--s-md);color:inherit;padding:.5rem 0;border-radius:0;outline:none}
input:focus,textarea:focus{border-bottom-width:2px}
textarea{resize:none;height:3.2rem}
.opts{display:flex;gap:2rem;flex-wrap:wrap;margin-top:.7rem}
.opts label{display:flex;gap:.6rem;align-items:center;font-style:normal;font-size:var(--s-md);cursor:pointer}
input[type=radio]{appearance:none;width:1.05rem;height:1.05rem;border:1px solid var(--blue-deep);border-radius:50%;display:grid;place-content:center;flex:none}
input[type=radio]::after{content:"";width:.55rem;height:.55rem;border-radius:50%;background:var(--blue-deep);transform:scale(0);transition:transform .4s var(--ease)}
input[type=radio]:checked::after{transform:scale(1)}
button{justify-self:start;background:var(--blue-deep);color:var(--gold);border:0;font:inherit;font-size:var(--s-md);font-style:italic;padding:1rem 2.6rem;cursor:pointer;transition:letter-spacing .6s var(--ease)}
button:hover{letter-spacing:.06em}
#msg{font-style:italic;min-height:1.5em}

/* closing */
.close{text-align:center;padding-bottom:clamp(4rem,10vh,8rem)}
.close .big{font-size:clamp(4.5rem,17vw,16rem);display:block;transform:rotate(-3deg)}
.close .nm{font-size:var(--s-md);letter-spacing:.4em;margin-top:2.2rem;text-indent:.4em}
.close small{display:block;margin-top:5rem;font-style:italic;font-size:var(--s-sm);opacity:.85}

/* 07 our honeymoon — a travel-journal page, centred rather than the usual side-by-side grid */
.gift-page{max-width:34rem;margin:0 auto;text-align:center}
.gift-page .ill{display:inline-block}
.gift-ill{width:clamp(13rem,42vw,18rem);margin:0 auto 1.6rem}
.gift-ill svg{display:block;margin:0 auto}
.gift-page h2{margin-top:0}
.gift-page .txt{max-width:38ch;margin:1.7rem auto 0;text-align:center}
.gift-rule{width:2.6rem;height:1px;background:var(--gold-line);margin:2.8rem auto;transform:scaleX(0);transform-origin:center;transition:transform 1.8s var(--ease) var(--d,0s)}
.sec.in .gift-rule{transform:none}
.gift-iban{margin:0 auto 2.2rem;display:flex;flex-direction:column;align-items:center;gap:.7rem}
.gift-crest{display:flex;align-items:center;justify-content:center}
.gift-iban-text{font-style:italic;font-size:calc(var(--s-sm)*.92);letter-spacing:.02em;opacity:.62}
.gift-iban-label{text-transform:uppercase;letter-spacing:.18em;font-size:.78em;margin-right:.55em}
.gift-iban-value{font-style:normal;letter-spacing:.035em}
.gift-flourish{width:2.3rem;height:auto;flex:none;opacity:.8;margin:0 -.15rem}
.gift-flourish svg{display:block;width:100%;height:auto}
.gift-flourish.right{transform:scaleX(-1)}
@media (max-width:720px){
  .gift-ill{width:min(78vw,15rem)}
  .gift-flourish{width:1.9rem}
}

/* ============ RESPONSIVE ============ */
@media (max-width:820px){
  .m-grid,.r-grid,.dc-grid,.onsite,.nr{grid-template-columns:1fr;gap:2rem}
  .m-grid,.r-grid{gap:3rem}
  .m-txt{padding-top:0}
  .d-grid{grid-template-columns:1fr}
  .d-txt{text-align:left}
  .ev .ln:nth-child(2){padding-left:9vw}.ev .ln:nth-child(3){padding-left:18vw}
  .sw-row{justify-content:flex-start;margin-top:2rem}
  .dc-l div{grid-template-columns:1fr;gap:.2rem}
}
@media (max-width:720px){
  .chand{height:clamp(16rem,44svh,26rem)}
  h1{font-size:clamp(3.4rem,min(23vw,17svh),9rem)}
  .a1{display:none}.a2{display:inline-block;margin:0 .1em 0 0;font-size:.7em}
  h1 .r{padding-right:0}
  .wd{margin-left:2vw;font-size:clamp(1.8rem,8.4vw,3.2rem)}
  .bottom{grid-template-columns:1fr 1fr;gap:1.4rem 1rem}
  .table{grid-column:1 / -1;grid-row:2}
  .row{grid-template-columns:1fr;gap:.3rem}
  .tl-row,.tl-row:nth-child(even){grid-template-columns:auto 1fr;gap:1.1rem;padding-left:0;align-items:center}
  .tl-t{font-size:clamp(3.2rem,19vw,5.6rem)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;transition-delay:0s!important;animation:none!important}
  html{scroll-behavior:auto}
}

/* ============ ILLUSTRATION SLOTS (added) ============ */
.ill{display:block}
.ill svg,.ill img{display:block;width:100%;height:auto}
.chand.ill{width:calc(clamp(19rem,52svh,36rem)*1.0256)}
.chand.ill svg{height:100%}
.ill-s{width:clamp(3.6rem,7.2vw,6.2rem);align-self:center;justify-self:end}
.ill-d{width:auto;height:clamp(5.6rem,8.2vw,7rem);align-self:center;justify-self:end}
.ill-d img,.ill-d svg{width:auto;height:100%}
.ill-d svg{opacity:0;transition:opacity 2.4s ease .4s}
.in .ill-d svg{opacity:1}
.ill-s.draw path:not(.fl),.ill-d.draw path:not(.fl){transition-duration:2.6s}
.tl-row{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto}
.dc-l div{grid-template-columns:minmax(7rem,1fr) 2.4fr auto}
@media (max-width:820px){
  .dc-l div{grid-template-columns:1fr auto;gap:.2rem 1rem}
  .dc-l .ill-d{grid-column:2;grid-row:1/3}
}
@media (max-width:720px){
  .chand.ill{width:calc(clamp(16rem,44svh,26rem)*1.0256)}
  .tl-row,.tl-row:nth-child(even){grid-template-columns:auto 1fr auto}
  .ill-s{width:3.2rem}
}

.ill img{opacity:0;transition:opacity 2.6s ease .3s}
.in .ill img{opacity:1}
</style>

<body>

<!-- Text comes from content.js, drawings from illustrations.js. This file is the design — no need to edit it. -->
<header class="hero io" id="top">
  <div class="top">
    <p class="dear script rv" style="--d:.9s" data-t="hero.dear"></p>
    <p class="look rv" style="--d:1.3s" data-t="hero.lookForward"></p>
  </div>
  <div class="chand-wrap" id="cw"><div class="chand ill" data-ill="chandelier" aria-hidden="true"></div></div>
  <div class="title">
    <p class="wd script rv" style="--d:2s" data-t="hero.dinnerOf"></p>
    <h1 id="h1">
      <span class="ln" aria-hidden="true" style="--d:2.2s"><span><span data-t="names.first"></span><i class="amp a1" data-t="names.joiner"></i></span></span>
      <span class="ln r" aria-hidden="true" style="--d:2.5s"><span><i class="amp a2" data-t="names.joiner"></i><span data-t="names.second"></span></span></span>
    </h1>
  </div>
  <div class="bottom">
    <p class="date rv" style="--d:3s"><span class="script" data-t="hero.weekday"></span><span data-t="hero.dateLines"></span></p>
    <div class="table ill draw" data-ill="dinnerTable" aria-hidden="true"></div>
    <p class="at rv" style="--d:3.2s"><span class="script" data-t="hero.atWord"></span><span data-t="hero.venueLines"></span><small data-t="hero.place"></small></p>
  </div>
</header>

<section class="sec io" id="date" aria-labelledby="l1">
  <p class="lab rv" id="l1" data-t="labels.date"></p>
  <div class="d-grid">
    <div class="d-wrap" aria-hidden="true">
      <span class="ln num"><span data-t="date.day"></span></span>
      <span class="mo script rv" style="--d:.8s" data-t="date.month"></span>
      <span class="yr rv" style="--d:1.1s" data-t="date.year"></span>
    </div>
    <div class="d-txt rv" style="--d:1.3s"><span data-t="date.text"></span><p id="cd" class="cd-live" aria-live="polite"></p></div>
  </div>
</section>

<section class="sec io" id="manoir" aria-labelledby="l2">
  <p class="lab rv" id="l2" data-t="labels.manoir"></p>
  <div class="m-grid">
    <div class="facade ill draw" data-ill="manor" aria-hidden="true"></div>
    <div class="m-txt">
      <h2 class="rv" data-t="manoir.title"></h2>
      <p class="txt rv" style="--d:.3s" data-t="manoir.text"></p>
      <address class="adr rv" style="--d:.45s" data-t="location.addressLines"></address>
      <a class="lk rv" style="--d:.6s" target="_blank" rel="noopener" data-link="googleMaps" data-t="location.button"></a>
    </div>
  </div>
</section>

<section class="sec io" id="evening" aria-labelledby="l3">
  <p class="lab rv" id="l3" data-t="labels.evening"></p>
  <div class="ev"><span class="ln"><span data-t="evening.l1"></span></span><span class="ln" style="--d:.2s"><span data-t="evening.l2"></span></span><span class="ln" style="--d:.4s"><span data-t="evening.l3"></span></span></div>
  <p class="ev-p rv" style="--d:.8s" data-t="evening.text"></p>
</section>

<section class="sec io" id="celebration" aria-labelledby="l4">
  <p class="lab rv" id="l4" data-t="labels.celebration"></p>
  <h2 class="rv" data-t="timeline.title"></h2>
  <p class="tl-note rv" style="--d:.2s" data-t="timeline.note"></p>
  <div id="tl"></div>
</section>

<section class="sec io" id="dress" aria-labelledby="l5">
  <p class="lab rv" id="l5" data-t="labels.dress"></p>
  <div class="dc-grid">
    <div>
      <h2 class="dc-h rv" data-t="dress.title"></h2>
      <dl class="dc-l rv" style="--d:.25s">
        <div><dt data-t="dress.menLabel"></dt><dd data-t="dress.menText"></dd><span class="ill ill-d draw" data-ill-from="dress.menIllustration" aria-hidden="true"></span></div>
        <div><dt data-t="dress.womenLabel"></dt><dd data-t="dress.womenText"></dd><span class="ill ill-d draw" data-ill-from="dress.womenIllustration" aria-hidden="true"></span></div>
      </dl>
    </div>
    <div><div class="sw-row" id="sw"></div></div>
  </div>
</section>

<section class="sec io" id="stay" aria-labelledby="l6">
  <p class="lab rv" id="l6" data-t="labels.stay"></p>
  <h2 class="rv" data-t="stay.title"></h2>
  <p class="txt rv" style="--d:.2s" data-t="stay.intro"></p>
  <div class="onsite rv" style="--d:.3s">
    <div><p class="lab2" data-t="stay.onsiteLabel"></p><h3 data-t="stay.onsite.name"></h3></div>
    <div><p class="d" data-t="stay.onsite.text"></p>
      <a class="lk" target="_blank" rel="noopener" data-link="manoirAccommodation" data-t="stay.onsite.button"></a><a class="lk" target="_blank" rel="noopener" data-link="googleMaps" data-t="stay.viewLocation"></a></div>
  </div>
  <p class="lab2 near-h rv" data-t="stay.nearbyLabel"></p>
  <div class="near" id="near"></div>
</section>

<section class="sec io" id="gift" aria-labelledby="l7">
  <p class="lab rv" id="l7" data-t="labels.gift"></p>
  <div class="gift-page">
    <span class="gift-ill ill draw rv" data-ill="honeymoon" aria-hidden="true"></span>
    <h2 class="rv" style="--d:.15s" data-t="gift.title"></h2>
    <p class="txt rv" style="--d:.3s" data-t="gift.text"></p>
    <div class="gift-rule rv" style="--d:.45s" aria-hidden="true"></div>
    <div class="gift-iban rv" style="--d:.55s">
      <span class="gift-crest" aria-hidden="true">
        <span class="gift-flourish left ill" data-ill="giftAccent"></span>
        <span class="gift-flourish right ill" data-ill="giftAccent"></span>
      </span>
      <span class="gift-iban-text"><span class="gift-iban-label" data-t="gift.bankLabel"></span><span class="gift-iban-value" data-t="gift.iban"></span></span>
    </div>
  </div>
</section>

<section class="sec io" id="info" aria-labelledby="l8">
  <p class="lab rv" id="l8" data-t="labels.info"></p>
  <dl class="info rv" id="info-l"></dl>
  <a class="lk rv" id="calLink" target="_blank" rel="noopener" data-t="event.calendarButton"></a>
</section>

<section class="sec rsvp io" id="rsvp" aria-labelledby="l9">
  <p class="lab rv" id="l9" data-t="labels.rsvp"></p>
  <div class="r-grid">
    <div>
      <p class="sc script rv" data-t="rsvp.script"></p>
      <h2 class="rv" style="--d:.15s" data-t="rsvp.title"></h2>
      <p class="txt rv" style="--d:.3s" data-t="rsvp.text"></p>
      <a class="lk rv" id="rsvpLink" target="_blank" rel="noopener" hidden data-t="rsvp.button"></a>
    </div>
    <form id="rsvpForm" class="rv" style="--d:.4s" novalidate>
      <div><label for="nm" data-t="rsvp.form.name"></label><input id="nm" name="name" type="text" autocomplete="name" required></div>
      <fieldset style="border:0"><legend class="fs" data-t="rsvp.form.reply"></legend>
        <div class="opts"><label><input type="radio" name="reply" value="yes" checked><span data-t="rsvp.form.yes"></span></label><label><input type="radio" name="reply" value="no"><span data-t="rsvp.form.no"></span></label></div></fieldset>
      <div><label for="nt" data-t="rsvp.form.note"></label><textarea id="nt" name="note"></textarea></div>
      <button type="submit" data-t="rsvp.form.submit"></button>
      <p id="msg" role="status"></p>
    </form>
  </div>
</section>

<footer class="sec close io" id="closing" aria-label="Closing">
  <span class="big script rv" data-t="closing.script"></span>
  <p class="nm rv" style="--d:.4s" data-t="closing.names"></p>
  <small class="rv" style="--d:.7s" data-t="closing.small"></small>
</footer>

<script>
/* ==========================================================================
   DESIGN CODE — nothing to edit below this line for normal changes.
   Content: content.js  ·  Illustrations: illustrations.js + assets/illustrations/
   ========================================================================== */
const W = weddingContent, L = links;
const get=(o,p)=>p.split('.').reduce((a,k)=>a&&a[k],o);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const enc=encodeURIComponent;
function setText(el,v){el.textContent='';String(v??'').split('\n').forEach((t,i)=>{if(i)el.appendChild(document.createElement('br'));el.appendChild(document.createTextNode(t))})}

document.title=W.pageTitle;
document.getElementById('h1').setAttribute('aria-label',W.names.first+' '+W.names.joiner+' '+W.names.second);

/* ---------- BUILT LISTS (timeline, swatches, nearby, info) ---------- */
const ill=(k,cls)=>k?`<span class="ill ${cls} draw" data-ill="${esc(k)}" aria-hidden="true"></span>`:'';
document.getElementById('tl').innerHTML=W.timeline.items.map((it,i)=>
  `<div class="tl-row rv${it.highlight?' hi':''}" style="--d:${(i*.15).toFixed(2)}s"><span class="tl-t">${esc(it.time)}</span><div><h3>${esc(it.title)}</h3>${it.note?`<p>${esc(it.note)}</p>`:''}</div>${ill(it.illustration,'ill-s')}</div>`).join('');
document.getElementById('sw').innerHTML=W.dress.colors.map((c,i)=>
  `<figure class="sw"><span class="arch"><i style="--c:${esc(c.hex)};--d:${(.4+i*.35).toFixed(2)}s"></i></span><figcaption>${esc(c.name)}</figcaption></figure>`).join('');
document.getElementById('near').innerHTML=W.stay.nearby.map((n,i)=>{const u=L[n.link];
  return `<article class="nr rv" style="--d:${(i*.1).toFixed(2)}s"><div><h3>${esc(n.name)}</h3><p class="loc">${esc(n.location)}${n.distance?' · '+esc(n.distance):''}</p></div><div><p class="d">${esc(n.text)}</p>${u?`<a class="lk" href="${esc(u)}" target="_blank" rel="noopener">${esc(W.stay.visitButton)}</a>`:''}</div></article>`}).join('');
document.getElementById('info-l').innerHTML=W.info.map(r=>`<div class="row"><dt>${esc(r.label)}</dt><dd>${esc(r.value)}</dd></div>`).join('');

/* ---------- TEXT, LINKS, ILLUSTRATION NAMES ---------- */
document.querySelectorAll('[data-ill-from]').forEach(el=>{const k=get(W,el.dataset.illFrom);k?el.dataset.ill=k:el.hidden=true});
document.querySelectorAll('[data-t]').forEach(el=>setText(el,get(W,el.dataset.t)));
document.querySelectorAll('[data-link]').forEach(el=>{const v=L[el.dataset.link];v?el.href=v:el.hidden=true});
const E=W.event;
document.getElementById('calLink').href=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${enc(E.calTitle)}&dates=${E.calStart}/${E.calEnd}&ctz=${enc(E.timezone)}&location=${enc(E.calLocation)}`;

/* ---------- ILLUSTRATIONS ----------
   Each [data-ill="name"] slot is filled from illustrations[name]:
   an inline "<svg…>" string, an .svg file (inlined so it can animate),
   or any other image URL (shown as a plain image). */
async function loadIll(el){
  const src=typeof illustrations!=='undefined'&&illustrations[el.dataset.ill];
  if(!src){el.hidden=true;return}
  let m=null;
  if(src.trim().startsWith('<')) m=src;
  else if(/\.svg(\?.*)?$/i.test(src)){try{const r=await fetch(src);if(r.ok){const t=await r.text();if(/<svg/i.test(t))m=t}}catch(e){}}
  if(m){
    el.innerHTML=m;const s=el.querySelector('svg');
    if(s&&s.getAttribute('viewBox')){s.removeAttribute('width');s.removeAttribute('height')}
    if(el.classList.contains('draw'))el.querySelectorAll('path:not(.fl)').forEach((p,i)=>{p.setAttribute('pathLength',1);p.style.transitionDelay=(i%45)*40+'ms'});
  }else{
    el.classList.remove('draw');const im=new Image();im.src=src;im.alt='';el.appendChild(im);
  }
}
const loads=[...document.querySelectorAll('[data-ill]')].map(loadIll);

/* ---------- REVEALS ---------- */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.14});
document.querySelectorAll('.sec.io,.close.io').forEach(el=>io.observe(el));
const hero=document.querySelector('.hero');
const fontsReady=document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,900))]):Promise.resolve();
Promise.race([Promise.all(loads),new Promise(r=>setTimeout(r,2500))]).then(()=>fontsReady).then(()=>requestAnimationFrame(()=>hero.classList.add('in')));

/* ---------- RESTRAINED PARALLAX ---------- */
const cw=document.getElementById('cw');
if(!matchMedia('(prefers-reduced-motion:reduce)').matches){
  let t=false;addEventListener('scroll',()=>{if(t)return;t=true;requestAnimationFrame(()=>{
    const y=Math.min(scrollY,innerHeight);cw.style.setProperty('--py',(y*.14)+'px');t=false})},{passive:true});
}

/* ---------- COUNTDOWN — live, to the minute ---------- */
function updateCountdown(){
  if(!W.date.countdown)return;
  const el=document.getElementById('cd');if(!el)return;
  const diff=new Date(E.startISO)-new Date();
  if(diff<=0){el.textContent='';return}
  const totalMin=Math.floor(diff/60000);
  const d=Math.floor(totalMin/1440),h=Math.floor((totalMin%1440)/60),m=totalMin%60;
  el.textContent=W.date.countdown.replace('{d}',d).replace('{h}',h).replace('{m}',m);
}
updateCountdown();
setInterval(updateCountdown,30000);

/* ---------- RSVP ---------- */
const R=W.rsvp,form=document.getElementById('rsvpForm'),rl=document.getElementById('rsvpLink');
if(L.rsvp){rl.href=L.rsvp;rl.hidden=false;if(!R.showForm)form.hidden=true}
form.addEventListener('submit',e=>{
  e.preventDefault();const f=new FormData(form),msg=document.getElementById('msg');
  if(!f.get('name').trim()){msg.textContent=R.form.errName;return}
  if(!R.email){msg.textContent=R.form.soon;return}
  const body=`${R.form.name}: ${f.get('name')}\n${R.form.reply}: ${R.form[f.get('reply')]}\n\n${f.get('note')||''}`;
  location.href=`mailto:${R.email}?subject=${enc('RSVP — '+E.calTitle)}&body=${enc(body)}`;
  msg.textContent=R.form.sent;
});
</script>
</body>
</html>
